// set sample rate. Only used by  QNX APP-Clusters or other QNX service.
// Only used for property with VehiclePropertyChangeMode::CONTINUOUS
message VehiclePropSampleRate {
    repeated SampleRateOption sample_rate_option = 1;
};

// Encapsulates information about vehicle property sample rate option
message SampleRateOption {
    /** Property to subscribe */
    required int32 prop = 1;

    /**
     * Sample rate in Hz.
     *
     * Must be provided for properties with
     * VehiclePropertyChangeMode::CONTINUOUS. The value must be within
     * VehiclePropConfig#minSamplingRate .. VehiclePropConfig#maxSamplingRate
     * for a given property.
     * This value indicates how many updates per second client wants to receive.
     */
    required float sample_rate = 2;

    optional int32 area_id = 3;
};

// Subscribe prop to QNX. Only used by Android VHAL
message VehicleSubscribeProp {
    required int32 prop = 1;
};

// Vehicle area config. Only used by Android VHAL
message VehicleAreaConfig {
    required int32  area_id             = 1;  // Area id
    optional sint32 min_int32_value     = 2;  // min int32_t value
    optional sint32 max_int32_value     = 3;  // max int32_t value
    optional sint64 min_int64_value     = 4;  // min int64_t value
    optional sint64 max_int64_value     = 5;  // max int64_t value
    optional float  min_float_value     = 6;  // min float value
    optional float  max_float_value     = 7;  // max float value
};

// Vehicle property config. Only used by Android VHAL
message VehiclePropConfig {
    required int32             prop                = 1;  // Property identifier
    optional int32             access              = 2;  // Defines if the property is read or write or both.
    optional int32             change_mode         = 3;  // Defines the change mode of the property
    optional int32             value_type          = 4;  // value type
    optional int32             supported_areas     = 5;  // Deprecated - DO NOT USE
    repeated VehicleAreaConfig area_configs        = 6;  // Contains per-area configuration
    optional int32             config_flags        = 7;  // config flag
    repeated int32             config_array        = 8;  // Contains additional configuration parameters
    optional string            config_string       = 9;  // Some properties may require additional information passed over this string
    optional float             min_sample_rate     = 10; // Min sample rate in Hz. Must be defined for VehiclePropertyChangeMode::CONTINUOUS
    optional float             max_sample_rate     = 11; // Max sample rate in Hz. Must be defined for VehiclePropertyChangeMode::CONTINUOUS
};

// Used by Android VHAL, QNX APP-Clusters and other QNX service.
// QNX APP-Clusters and other QNX service must use this message to communication with QNX VehicleServcie
message VehiclePropValue {
    // common data
    required int32  prop                = 1;  // Property identifier. Android VHAL, QNX APP-Clusters and other QNX service require to set it
    optional int32  value_type          = 2;  // value type
    optional int64  timestamp           = 3;    // required for valid data from Android VHAL. QNX APP-Clusters and other QNX service ignore it
    optional VehiclePropStatus  status  = 10;   // Android VHAL and QNX APP-Clusters and other QNX service used to indicate whether an error occurred

    // values
    optional int32  area_id             = 4;  // required for valid data from Android VHAL. QNX APP-Clusters and other QNX service ignore it
    repeated sint32 int32_values        = 5;  // If the property is INT32 or BOOL or INT32_VEC, Android VHAL, QNX APP-Clusters and other QNX service need to set it
    repeated sint64 int64_values        = 6;  // If the property is INT64 or INT64_VEC, Android VHAL, QNX APP-Clusters and other QNX service need to set it
    repeated float  float_values        = 7;  // If the property is FLOAT or FLOAT_VEC, Android VHAL, QNX APP-Clusters and other QNX service need to set it
    optional string string_value        = 8;  // If the property is STRING, Android VHAL, QNX APP-Clusters and other QNX service need to set it
    optional bytes  bytes_value         = 9;  // If the property is BYTES, Android VHAL, QNX APP-Clusters and other QNX service need to set it
    repeated double double_values       = 11; // If the property is FLOAT or FLOAT_VEC, Android VHAL, QNX APP-Clusters and other QNX service need to set it
};

// This structure is used to notify what values to get from the Vehicle HAL. Only used by Android VHAL
message VehiclePropGet {
    required int32 prop                 = 1;  // Property identifier
    optional int32 area_id              = 2;  // area id
};

// This structure is usded between QNX and VHAL to calculate time delay and offset
message VehicleTimeSync {
    required int64 t1                   = 1;  // timestamp of sending SYNC_TIME_REQ by QNX
    optional int64 t2                   = 2;  // timestamp of SYNC_TIME_REQ arriving at VHAL
    optional int64 t3                   = 3;  // timestamp of sending SYNC_TIME_RESP by VHAL
    optional int64 t4                   = 4;  // timestamp of SYNC_TIME_RESP arriving at QNX
};

// Only Used by Android VHAL. Android VHal and QNX VehicleServcie use this message to communication
message VehicleMessage {
    required MsgType           msg_type = 1;    // message type
    optional Status            status   = 2;    // Only for RESP messages
    repeated VehiclePropGet    prop     = 3;    // Provided for getConfig, getProperty commands
    repeated VehiclePropConfig config   = 4;    // vehicle property config
    repeated VehiclePropValue  value    = 5;    // vehicle property value
    optional VehicleTimeSync   sync_time= 6;    // Sync time stamps between QNX and VHAL
};

// Used by VehicleTool to print statistics
message PropertyStatistics {
    required int32             prop_num = 1;    // print number
}

// Used by VehicleTool to transfer can buffer
message VehicleCanMessage {
    required int32             prop     = 1;     // Property identifier
    required int32             area_id  = 2;     // Property area ID
    repeated uint64            values   = 3;     // values of the simulated signals
    optional int32             rx_type  = 4;     // type of simulated rx inc frame
}

// Used by VehicleTool for requests
message ToolRequestMessage {
    required int32      opt_id      = 1;    // operation id to request
    optional string     key         = 2;    // key word to the request
}

// Used by VehicleTool to set signal filter
message SignalFilterMessage {
    required int32    signal_filter = 1;    // operation signal_filter to set
}

// Used by Binary Log
enum AppID {
  APP_VehicleService = 1;
}

enum LogLevel {
  VS_LOG_ERROR  = 1;
  VS_LOG_WARN   = 2;
  VS_LOG_NOTICE = 3;
  VS_LOG_INFO   = 4;
  VS_LOG_DEBUG  = 5;
}

enum Tag {
  TAG_DEF = 0;
}

message Event {
  required uint32 id             = 1;
  repeated sint32 int32_values   = 2 [packed = true];
  repeated sint64 int64_values   = 3 [packed = true];
  repeated float  float_values   = 4 [packed = true];
  repeated double double_values  = 5 [packed = true];
  optional string string_values  = 6 ;
  optional bytes  bytes_values   = 7 ;
}

message LogItem {
  required AppID     app_id         = 1;
  required LogLevel  level          = 2;
  required uint32    time_stamp     = 3;
  required uint32    monotonic_time = 4;
  required uint32    seq            = 5;
  required Tag       tag            = 6 [default = TAG_DEF];

  repeated Event     events         = 7 ;
}

