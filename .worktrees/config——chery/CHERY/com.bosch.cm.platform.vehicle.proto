syntax = "proto2";
//option optimize_for = LITE_RUNTIME;

package bosch.platform.vehicle.pb;

// CMD messages are from Android VHAL or QNX APP-Clusters --> QNX VehicleService
// RESP messages are from QNX VehicleService --> Android VHAL or QNX APP-Clusters
enum MsgType {
    GET_CONFIG_CMD                      = 0;   // Used by Android VHAL
    GET_CONFIG_RESP                     = 1;   // Used by Android VHAL
    GET_CONFIG_ALL_CMD                  = 2;   // Used by Android VHAL
    GET_CONFIG_ALL_RESP                 = 3;   // Used by Android VHAL
    GET_PROPERTY_CMD                    = 4;   // Used by Android VHAL
    GET_PROPERTY_RESP                   = 5;   // Used by Android VHAL
    GET_PROPERTY_ALL_CMD                = 6;   // Used by Android VHAL
    GET_PROPERTY_ALL_RESP               = 7;   // Used by Android VHAL
    SET_PROPERTY_CMD                    = 8;   // Used by Android VHAL
    SET_PROPERTY_RESP                   = 9;   // Used by Android VHAL
    SET_PROPERTY_ASYNC                  = 10;  // Used by Android VHAL
    PROPERTY_CHANGE_CALLBACK            = 11;  // Used by Android VHAL
    PROPERTY_SET_ERROR_CALLBACK         = 12;  // Used by Android VHAL
    PROPERTY_INIT_ALL_CMD               = 13;  // Used by Android VHAL
    PROPERTY_INIT_ALL_RESP              = 14;  // Used by Android VHAL
    SET_PROPERTY_VALUE_CMD              = 15;  // Used by QNX APP-Clusters or other QNX service
    SET_PROPERTY_VALUE_RESP             = 16;  // reserverd
    GET_PROPERTY_VALUE_CMD              = 17;  // Used by QNX APP-Clusters or other QNX service
    GET_PROPERTY_VALUE_RESP             = 18;  // reserverd
    SET_PROPERTY_SAMPLE_RATE            = 19;  // Used by QNX APP-Clusters or other QNX service
    PROPERTY_SUBSCRIBE                  = 20;  // Used by Android VHAL
    PROPERTY_UNSUBSCRIBE                = 21;  // Used by Android VHAL
    GET_PROPERTY_STATISTICS             = 22;  // Used by Vehicle Tool
    CLEAR_PROPERTY_STATISTICS           = 23;  // Used by Vehicle Tool
    GET_CAR_TYPE                        = 24;  // Used by Vehicle Tool
    SET_SIMULATE_CANMSG                 = 25;  // Used by Vehicle Tool
    TOOL_REQUEST                        = 26;  // Used by Vehicle Tool
    SYNC_TIME_REQ                       = 27;  // Send from QNX to VHAL to requst timestamp
    SYNC_TIME_RESP                      = 28;  // resp from VHAL to QNX for the timestamp
    SETSIGNALFILTER                     = 29;  // Used by Vehicle Tool
    MSG_TYPE_MAX                        = 30;  // max msg type
}

// Only for RESP messages from QNX VehicleService to Android VHAL
enum Status {
    RESULT_OK                           = 0;  // Ok
    ERROR_UNKNOWN                       = 1;  // Unknow error
    ERROR_UNIMPLEMENTED_CMD             = 2;  // unimplemented cmd
    ERROR_INVALID_PROPERTY              = 3;  // invalid property
    ERROR_INVALID_AREA_ID               = 4;  // invlaid area id
    ERROR_PROPERTY_UNINITIALIZED        = 5;  // uninitialized property
    ERROR_WRITE_ONLY_PROPERTY           = 6;  // write only property
    ERROR_MEMORY_ALLOC_FAILED           = 7;  // memory alloc failed
    ERROR_INVALID_OPERATION             = 8;  // invalid operation
    ERROR_LOST                          = 9;  // siganl missing or can node lost
}

// Used by Android VHAL and QNX APP-Clusters or other QNX service. Used to represent vehicle property status
enum VehiclePropStatus {
    AVAILABLE                           = 0;  // The property is available
    UNAVAILABLE                         = 1;  // The property is unavailable
    ERROR                               = 2;  // The property is error, such as siganl missing or can node lost
    DEFAULT                             = 3;  // The property has never received the signal from GW
}

