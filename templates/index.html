
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jira 自动分析工具</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fa; color: #222; }
    .wrap { max-width: 1280px; margin: 0 auto; padding: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
    .group-card, .result-card { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .group-card { padding: 16px; }
    .group-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
    .group-title { margin: 0; font-size: 18px; }
    .group-jql { margin: 0; color: #666; font-size: 13px; line-height: 1.5; word-break: break-word; }
    button { background: #1677ff; color: #fff; border: 0; border-radius: 6px; padding: 10px 18px; cursor: pointer; flex-shrink: 0; }
    button[disabled] { opacity: .6; cursor: not-allowed; }
    .task-meta { color: #666; font-size: 14px; margin-top: 12px; }
    .results { margin-top: 14px; display: flex; flex-direction: column; gap: 12px; }
    .result-card { padding: 14px; }
    .result-text {
      width: 100%;
      min-height: 96px;
      box-sizing: border-box;
      resize: none;
      overflow-y: hidden;
      border: 1px solid #d9d9d9;
      white-space: pre-wrap;
      line-height: 1.6;
      font: inherit;
      color: inherit;
      background: #fafafa;
      padding: 12px;
      border-radius: 6px;
    }
    .result-text:focus { outline: none; border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.12); background: #fff; }
    img { max-width: 100%; margin-top: 12px; border-radius: 6px; border: 1px solid #eee; }
    .task-status { font-weight: bold; }
    .muted { color: #888; }
    @media (max-width: 768px) {
      .wrap { padding: 16px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Jira 自动分析工具</h1>
  <div id="groups" class="grid"></div>
</div>
<script>
  const groupState = new Map();
  const resultDrafts = new Map();
  const resultSaving = new Set();
  let eventSource = null;

  async function loadGroups() {
    const res = await fetch('/api/tasks/groups/');
    const groups = await res.json();
    applyGroups(groups);
  }

  function renderGroups(groups) {
    const box = document.getElementById('groups');
    box.innerHTML = groups.map(group => `
      <div class="group-card" id="group-${group.role_index}">
        <div class="group-header">
          <div>
            <h2 class="group-title">${escapeHtml(group.role_label)}</h2>
            <p class="group-jql">${escapeHtml(group.jql || '')}</p>
          </div>
          <button id="start-btn-${group.role_index}" onclick="startTask(${group.role_index})">开始分析</button>
        </div>
        <div id="task-info-${group.role_index}" class="task-meta muted">当前没有任务</div>
        <div id="results-${group.role_index}" class="results"></div>
      </div>
    `).join('');
  }

  function renderGroupCard(roleIndex) {
    const state = groupState.get(roleIndex);
    if (!state) return;

    const { task } = state;
    const taskInfo = document.getElementById(`task-info-${roleIndex}`);
    const resultsBox = document.getElementById(`results-${roleIndex}`);
    const startBtn = document.getElementById(`start-btn-${roleIndex}`);

    if (!task) {
      taskInfo.innerHTML = '当前没有任务';
      resultsBox.innerHTML = '';
      startBtn.disabled = false;
      return;
    }

    startBtn.disabled = ['PENDING', 'RUNNING'].includes(task.status);
    taskInfo.innerHTML = `任务 #${task.id} | <span class="task-status">${task.status}</span> | 进度 ${task.progress || 0}% | ${escapeHtml(task.message || '')}`;
    resultsBox.innerHTML = (task.results || []).map(item => `
      <div class="result-card">
        <h3>${escapeHtml(item.issue_key)} - ${escapeHtml(item.summary || '')}</h3>
        <div class="task-meta">车型：${escapeHtml(item.model || '-')} ｜ 状态：${escapeHtml(item.result_status)} ｜ 已回填 Jira：${item.has_commented_to_jira ? '是' : '否'}</div>
        <textarea
          id="reply-text-${item.id}"
          class="result-text"
          oninput="handleResultInput(${item.id}, this.value)"
        >${escapeHtml(getReplyText(item))}</textarea>
        <div style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <button id="save-btn-${item.id}" onclick="saveResult(${item.id})" ${resultSaving.has(item.id) ? 'disabled' : ''}>${resultSaving.has(item.id) ? '保存中...' : '保存'}</button>
          <span id="save-status-${item.id}" class="muted">${getSaveStatusText(item)}</span>
        </div>
        ${item.can_trace_image_url ? `<img src="${item.can_trace_image_url}" alt="can trace">` : ''}
        ${!item.has_commented_to_jira ? `<div style="margin-top:12px;"><button onclick="commentToJira(${item.id})">回填 Jira</button></div>` : ''}
      </div>
    `).join('') || '<div class="muted">暂无分析结果</div>';
    autoResizeAllResultTextareas();
  }

  function applyGroups(groups) {
    renderGroups(groups);
    groups.forEach((group) => {
      groupState.set(group.role_index, { group, task: group.latest_task || null });
      renderGroupCard(group.role_index);
    });
  }

  async function startTask(roleIndex) {
    const startBtn = document.getElementById(`start-btn-${roleIndex}`);
    startBtn.disabled = true;

    const res = await fetch('/api/tasks/start/', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ role_index: roleIndex }),
    });
    const data = await res.json();

    if (!res.ok && res.status !== 409) {
      alert(data.detail || '启动失败');
      startBtn.disabled = false;
      return;
    }

    if (data.task_id) {
      const state = groupState.get(roleIndex);
      if (state) {
        state.task = {
          ...(state.task || {}),
          id: data.task_id,
          status: data.status || (res.status === 409 ? 'RUNNING' : 'PENDING'),
          role_index: data.role_index || roleIndex,
          role_label: data.role_label || state.group.role_label,
          progress: state.task?.progress || 0,
          message: data.detail || '任务已启动',
          results: state.task?.results || [],
        };
        groupState.set(roleIndex, state);
        renderGroupCard(roleIndex);
      }
    }
  }

  async function commentToJira(id) {
    const res = await fetch(`/api/results/${id}/comment/`, {method: 'POST'});
    const data = await res.json();
    alert(data.detail || '操作完成');
  }

  function getReplyText(item) {
    return resultDrafts.has(item.id) ? resultDrafts.get(item.id) : (item.reply_text || '');
  }

  function getSaveStatusText(item) {
    return resultDrafts.has(item.id) ? '有未保存修改' : `最后更新：${formatTime(item.updated_at)}`;
  }

  function handleResultInput(id, value) {
    const item = findResultById(id);
    if (!item) return;

    if (value === (item.reply_text || '')) {
      resultDrafts.delete(id);
    } else {
      resultDrafts.set(id, value);
    }
    autoResizeTextareaById(id);
    updateSaveStatus(id);
  }

  function updateSaveStatus(id) {
    const saveBtn = document.getElementById(`save-btn-${id}`);
    const saveStatus = document.getElementById(`save-status-${id}`);
    const item = findResultById(id);
    if (!item || !saveBtn || !saveStatus) return;

    saveBtn.disabled = resultSaving.has(id);
    saveBtn.textContent = resultSaving.has(id) ? '保存中...' : '保存';
    saveStatus.textContent = getSaveStatusText(item);
  }

  function findResultById(id) {
    for (const state of groupState.values()) {
      const result = (state.task?.results || []).find(item => item.id === id);
      if (result) return result;
    }
    return null;
  }

  async function saveResult(id) {
    const textarea = document.getElementById(`reply-text-${id}`);
    const item = findResultById(id);
    if (!textarea || !item) return;

    const replyText = textarea.value;
    resultSaving.add(id);
    updateSaveStatus(id);

    try {
      const res = await fetch(`/api/results/${id}/save/`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ reply_text: replyText }),
      });
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.detail || '保存失败');
      }

      item.reply_text = data.result.reply_text || '';
      item.updated_at = data.result.updated_at;
      resultDrafts.delete(id);
      textarea.value = item.reply_text;
      autoResizeTextarea(textarea);
      updateSaveStatus(id);
      alert(data.detail || '保存成功');
    } catch (error) {
      alert(error.message || '保存失败');
    } finally {
      resultSaving.delete(id);
      updateSaveStatus(id);
    }
  }

  function formatTime(value) {
    if (!value) return '-';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return value;
    return date.toLocaleString('zh-CN', { hour12: false });
  }

  function autoResizeTextarea(textarea) {
    if (!textarea) return;
    textarea.style.height = 'auto';
    textarea.style.height = `${textarea.scrollHeight}px`;
  }

  function autoResizeTextareaById(id) {
    autoResizeTextarea(document.getElementById(`reply-text-${id}`));
  }

  function autoResizeAllResultTextareas() {
    document.querySelectorAll('.result-text').forEach(autoResizeTextarea);
  }

  function connectTaskStream() {
    if (eventSource) {
      eventSource.close();
    }
    eventSource = new EventSource('/api/tasks/stream/');
    eventSource.addEventListener('groups', (event) => {
      const groups = JSON.parse(event.data);
      applyGroups(groups);
    });
    eventSource.onerror = () => {
      if (eventSource) {
        eventSource.close();
      }
      setTimeout(connectTaskStream, 3000);
    };
  }

  function escapeHtml(str) {
    return String(str)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  async function boot() {
    await loadGroups();
    connectTaskStream();
  }

  boot();
</script>
</body>
</html>
